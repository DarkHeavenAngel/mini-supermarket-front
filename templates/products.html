{% extends 'layout.html' %}
{% load static %}

{% block title %}Товари | Злагода{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/employees.css' %}">
<link rel="stylesheet" href="{% static 'css/custom-select.css' %}">

<style>
    html[data-role="Касир"] .manager-only {
        display: none !important;
    }
</style>

<div class="page-header">
    <h1>Довідник товарів</h1>
    <button id="btn-open-modal" class="action-btn primary manager-only">
        <i class="fa-solid fa-plus"></i> Додати товар
    </button>
</div>

<div class="toolbar">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Пошук за назвою...">
    </div>
    <div class="filter-box">
        <select id="category-filter">
            <option value="">Всі категорії</option>
            </select>
    </div>
</div>

<div class="table-container" style="overflow-x: auto;">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Категорія</th>
                <th>Характеристики</th>
                <th>Виробник</th>
                <th class="manager-only" style="min-width: 100px;">Дії</th>
            </tr>
        </thead>
        <tbody id="products-table-body">
            <tr><td colspan="6" style="text-align: center; padding: 20px;">Завантаження даних...</td></tr>
        </tbody>
    </table>
</div>

<div id="product-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 600px;">
        <div class="modal-header">
            <h2 id="modal-title">Додати товар</h2>
            <button id="btn-close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form id="product-form" class="modal-form" novalidate>
            <div id="modal-error-message" class="alert alert-error" style="display: none; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="modal-error-text"></span>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>ID товару *</label>
                    <input type="number" id="id_product" required min="1">
                </div>
                <div class="form-group">
                    <label>Категорія *</label>
                    <select id="category_number" required>
                        <option value="" disabled selected>Оберіть категорію</option>
                        </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Назва товару *</label>
                    <input type="text" id="product_name" required maxlength="50">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Характеристики *</label>
                    <input type="text" id="characteristics" required maxlength="100" placeholder="Напр: 1л, 2.5%, жирне">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Виробник *</label>
                    <input type="text" id="manufacturer" required maxlength="50">
                </div>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-cancel" class="action-btn secondary">Скасувати</button>
                <button type="submit" class="action-btn primary">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-box logout-modal-box">
        <div class="modal-header logout-modal-header">
            <h2><i class="fa-solid fa-triangle-exclamation" style="color: var(--color-rust);"></i> Підтвердження</h2>
        </div>
        <p class="logout-modal-text" id="delete-modal-text">Ви дійсно хочете видалити товар?</p>
        <div class="logout-modal-actions">
            <button type="button" id="btn-cancel-delete" class="action-btn secondary">Скасувати</button>
            <button type="button" id="btn-confirm-delete" class="action-btn warning">Видалити</button>
        </div>
    </div>
</div>

<script src="{% static 'js/custom-select.js' %}"></script>
<script src="{% static 'js/products.js' %}"></script>
{% endblock %}
