{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід - АІС Злагода</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="{% static 'css/alerts.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-wrapper-artwork" style="--mask-url: url('{% static "img/vine.jpg" %}')"></div>

        <div class="login-box">

            <div class="login-header">
                <h2><i class="fa-solid fa-basket-shopping"></i> ЗЛАГОДА</h2>
                <p style="color: var(--text-muted); margin-top: 8px; font-size: 15px;">АІС керування супермаркетом</p>
            </div>

            <div id="error-message" class="alert alert-error" style="display: none;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="error-text">Невірний ID або пароль</span>
            </div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="id_employee">ID працівника</label>
                    <input type="text" id="id_employee" required placeholder="Введіть ваш табельний номер">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" required placeholder="Введіть ваш пароль">
                </div>

                <button type="submit" class="action-btn primary login-btn">
                    <i class="fa-solid fa-right-to-bracket" style="margin-right: 8px;"></i> Увійти в систему
                </button>
            </form>

        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
