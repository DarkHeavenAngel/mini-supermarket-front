{% extends 'layout.html' %}
{% load static %}

{% block title %}Персонал | Злагода{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/employees.css' %}">

<div class="page-header">
    <h1>Управління персоналом</h1>
    <button id="btn-open-modal" class="action-btn primary">
        <i class="fa-solid fa-user-plus"></i> Додати працівника
    </button>
</div>

<div class="toolbar">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Пошук за прізвищем...">
    </div>
    <div class="filter-box">
        <select id="role-filter">
            <option value="">Всі посади</option>
            <option value="Менеджер">Менеджери</option>
            <option value="Касир">Касири</option>
        </select>
    </div>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>ПІБ</th>
                <th>Посада</th>
                <th>Телефон</th>
                <th>Місто</th>
                <th>Зарплата</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody id="employees-table-body">
            <tr>
                <td colspan="7" style="text-align: center; padding: 20px;">Завантаження даних...</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="employee-modal" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="modal-title">Додати працівника</h2>
            <button id="btn-close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="employee-form" class="modal-form" novalidate>

            <div id="modal-error-message" class="alert alert-error" style="display: none; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="modal-error-text"></span>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>ID Працівника *</label>
                    <input type="text" id="id_employee" required maxlength="10" placeholder="Напр. E001">
                </div>
                <div class="form-group">
                    <label>Посада *</label>
                    <select id="empl_role" required>
                        <option value="" disabled selected>Оберіть посаду...</option>
                        <option value="Менеджер">Менеджер</option>
                        <option value="Касир">Касир</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Прізвище *</label>
                    <input type="text" id="empl_surname" required>
                </div>
                <div class="form-group">
                    <label>Ім'я *</label>
                    <input type="text" id="empl_name" required>
                </div>
                <div class="form-group">
                    <label>По батькові</label>
                    <input type="text" id="empl_patronymic" placeholder="Не обов'язково">
                </div>
                <div class="form-group" id="password-group">
                    <label>Пароль (для входу) *</label>
                    <input type="password" id="employee_password" placeholder="Введіть пароль">
                </div>
                <div class="form-group">
                    <label>Зарплата (грн) *</label>
                    <input type="number" id="salary" step="0.01" min="0" required>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="text" id="phone_number" value="+380" maxlength="13" required>
                </div>
                <div class="form-group">
                    <label>Дата народження *</label>
                    <input type="date" id="date_of_birth" required>
                </div>
                <div class="form-group">
                    <label>Дата початку роботи *</label>
                    <input type="date" id="date_of_start" required>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Місто, Вулиця, Індекс *</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="city" placeholder="Місто" required style="flex: 1;">
                        <input type="text" id="street" placeholder="Вулиця" required style="flex: 1;">
                        <input type="text" id="zip_code" placeholder="Індекс" maxlength="9" required style="width: 100px;">
                    </div>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" id="btn-cancel" class="action-btn secondary">Скасувати</button>
                <button type="submit" class="action-btn primary">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-box logout-modal-box"> <div class="modal-header logout-modal-header">
            <h2><i class="fa-solid fa-triangle-exclamation" style="color: var(--color-rust);"></i> Підтвердження</h2>
        </div>
        <p class="logout-modal-text" id="delete-modal-text">Ви дійсно хочете видалити працівника?</p>
        <div class="logout-modal-actions">
            <button type="button" id="btn-cancel-delete" class="action-btn secondary">Скасувати</button>
            <button type="button" id="btn-confirm-delete" class="action-btn warning">Видалити</button>
        </div>
    </div>
</div>

<script src="{% static 'js/employees.js' %}"></script>
{% endblock %}
