{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АІС Злагода{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/alerts.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-basket-shopping"></i> ЗЛАГОДА</h2>
            </div>
            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item">
                        <a href="{% url 'home' %}" class="nav-link active"><i class="fa-solid fa-house"></i> <span>Головна</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link"><i class="fa-solid fa-cash-register"></i> <span>Каса (Чеки)</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link"><i class="fa-solid fa-boxes-stacked"></i> <span>Склад (Товари)</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'employees' %}" class="nav-link"><i class="fa-solid fa-users"></i> <span>Персонал</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link"><i class="fa-solid fa-address-card"></i> <span>Клієнти</span></a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link"><i class="fa-solid fa-chart-pie"></i> <span>Звіти</span></a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <button class="toggle-btn" id="toggle-btn">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="user-info" id="user-info-container">
                    <a href="/profile/" class="action-btn secondary" style="text-decoration: none; padding: 8px 15px; font-size: 14px;">
                        <i class="fa-solid fa-user"></i> Профіль
                    </a>
                    <a href="#" id="logout-btn" class="logout-btn">
                        <i class="fa-solid fa-right-from-bracket"></i> Вийти
                    </a>
                </div>

            </header>

            <div class="content-area">
                {% block content %}
                {% endblock %}
            </div>
        </main>
    </div>
    <div id="logout-modal" class="modal-overlay hidden">
    <div class="modal-box logout-modal-box">
        <div class="modal-header logout-modal-header">
            <h2><i class="fa-solid fa-right-from-bracket"></i> Вихід з системи</h2>
        </div>
        <p class="logout-modal-text">Ви дійсно хочете завершити поточний сеанс?</p>
        <div class="logout-modal-actions">
            <button type="button" id="btn-cancel-logout" class="action-btn secondary">Скасувати</button>
            <button type="button" id="btn-confirm-logout" class="action-btn warning">Вийти</button>
        </div>
    </div>
</div>
    <script src="{% static 'js/api.js' %}"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
