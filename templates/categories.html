{% extends 'layout.html' %}
{% load static %}

{% block title %}Категорії | Злагода{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/employees.css' %}">

<style>
    html[data-role="Касир"] .manager-only {
        display: none !important;
    }
</style>

<div class="page-header">
    <h1>Категорії товарів</h1>
    <button id="btn-open-modal" class="action-btn primary manager-only">
        <i class="fa-solid fa-folder-plus"></i> Додати категорію
    </button>
</div>

<div class="toolbar">
    <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Пошук за назвою...">
    </div>
</div>

<div class="table-container">
    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 20%;">Номер категорії</th>
                <th>Назва категорії</th>
                <th class="manager-only" style="width: 15%;">Дії</th>
            </tr>
        </thead>
        <tbody id="categories-table-body">
            <tr>
                <td colspan="3" style="text-align: center; padding: 20px;">Завантаження даних...</td>
            </tr>
        </tbody>
    </table>
</div>

<div id="category-modal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width: 500px;">
        <div class="modal-header">
            <h2 id="modal-title">Додати категорію</h2>
            <button id="btn-close-modal" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form id="category-form" class="modal-form" novalidate>
            <div id="modal-error-message" class="alert alert-error" style="display: none; margin-bottom: 20px;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="modal-error-text"></span>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Номер категорії *</label>
                <input type="number" id="category_number" required min="1" placeholder="Напр. 1">
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label>Назва категорії *</label>
                <input type="text" id="category_name" required maxlength="50" placeholder="Введіть назву">
            </div>

            <div class="form-actions">
                <button type="button" id="btn-cancel" class="action-btn secondary">Скасувати</button>
                <button type="submit" class="action-btn primary">Зберегти</button>
            </div>
        </form>
    </div>
</div>

<div id="delete-modal" class="modal-overlay hidden">
    <div class="modal-box logout-modal-box">
        <div class="modal-header logout-modal-header">
            <h2><i class="fa-solid fa-triangle-exclamation" style="color: var(--color-rust);"></i> Підтвердження</h2>
        </div>
        <p class="logout-modal-text" id="delete-modal-text">Ви дійсно хочете видалити категорію?</p>
        <div class="logout-modal-actions">
            <button type="button" id="btn-cancel-delete" class="action-btn secondary">Скасувати</button>
            <button type="button" id="btn-confirm-delete" class="action-btn warning">Видалити</button>
        </div>
    </div>
</div>

<script src="{% static 'js/categories.js' %}"></script>
{% endblock %}
