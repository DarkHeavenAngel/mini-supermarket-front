{% extends 'layout.html' %}

{% block title %}Головна панель | Злагода{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1 id="welcome-header" style="display: none;"></h1>
        <p id="current-date" class="date-display"></p>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--color-muted-green);"><i class="fa-solid fa-check-to-slot"></i></div>
            <div class="stat-info">
                <h3>Чеки за сьогодні</h3>
                <p class="stat-value" id="stat-checks">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--color-gold);"><i class="fa-solid fa-tags"></i></div>
            <div class="stat-info">
                <h3>Акційні товари</h3>
                <p class="stat-value" id="stat-promo">0</p>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon" style="background-color: var(--color-orange);"><i class="fa-solid fa-address-card"></i></div>
            <div class="stat-info">
                <h3>Клієнтські картки</h3>
                <p class="stat-value" id="stat-cards">0</p>
            </div>
        </div>
    </div>

    <div class="quick-actions">
        <h2>Швидкі дії</h2>
        <div class="action-buttons">
            <a href="{% url 'checks' %}" class="action-btn primary" style="text-decoration: none;">
                <i class="fa-solid fa-plus"></i> Створити чек
            </a>

            <a href="{% url 'store_products' %}" id="btn-receive-goods" class="action-btn secondary" style="text-decoration: none;">
                <i class="fa-solid fa-box-open"></i> Оприходувати товар
            </a>

            <a href="{% url 'reports' %}" id="btn-daily-report" class="action-btn warning" style="text-decoration: none;">
                <i class="fa-solid fa-file-invoice"></i> Звіт за день
            </a>
        </div>
    </div>
</div>
{% endblock %}
